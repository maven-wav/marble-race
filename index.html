<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0d17">
<title>구슬 레이스 추첨</title>
<!-- 굿딜 버튼용 서체. 로드 실패 시 시스템 폰트로 폴백 — 이 CDN 만 예외 허용 -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.css">
<script>
var QRMini = (function () {
  'use strict';

  // 버전별: [블록당 EC 코드워드, [ [블록수, 블록당 데이터 코드워드], ... ] ]  (레벨 M)
  var SPEC = {
    1:  [10, [[1, 16]]],
    2:  [16, [[1, 28]]],
    3:  [26, [[1, 44]]],
    4:  [18, [[2, 32]]],
    5:  [24, [[2, 43]]],
    6:  [16, [[4, 27]]],
    7:  [18, [[4, 31]]],
    8:  [22, [[2, 38], [2, 39]]],
    9:  [22, [[3, 36], [2, 37]]],
    10: [26, [[4, 43], [1, 44]]]
  };
  var ALIGN = {
    1: [], 2: [6, 18], 3: [6, 22], 4: [6, 26], 5: [6, 30],
    6: [6, 34], 7: [6, 22, 38], 8: [6, 24, 42], 9: [6, 26, 46], 10: [6, 28, 50]
  };

  // ---- GF(256) ----
  var EXP = new Uint8Array(512), LOG = new Uint8Array(256);
  (function () {
    var x = 1;
    for (var i = 0; i < 255; i++) {
      EXP[i] = x; LOG[x] = i;
      x <<= 1; if (x & 0x100) x ^= 0x11d;
    }
    for (var j = 255; j < 512; j++) EXP[j] = EXP[j - 255];
  })();
  function gmul(a, b) { return (a === 0 || b === 0) ? 0 : EXP[LOG[a] + LOG[b]]; }

  function rsGenerator(n) {
    var g = [1];
    for (var i = 0; i < n; i++) {
      var ng = new Array(g.length + 1).fill(0);
      for (var j = 0; j < g.length; j++) {
        ng[j] ^= g[j];
        ng[j + 1] ^= gmul(g[j], EXP[i]);
      }
      g = ng;
    }
    return g;
  }
  function rsEncode(data, ecLen) {
    var gen = rsGenerator(ecLen);
    var res = new Array(ecLen).fill(0);
    for (var i = 0; i < data.length; i++) {
      var factor = data[i] ^ res[0];
      res.shift(); res.push(0);
      if (factor !== 0) for (var j = 0; j < gen.length - 1; j++) res[j] ^= gmul(gen[j + 1], factor);
    }
    return res;
  }

  // ---- 비트 스트림 ----
  function BitBuf() { this.bits = []; }
  BitBuf.prototype.put = function (val, len) {
    for (var i = len - 1; i >= 0; i--) this.bits.push((val >>> i) & 1);
  };

  function utf8Bytes(str) {
    var out = [], i, c;
    for (i = 0; i < str.length; i++) {
      c = str.charCodeAt(i);
      if (c < 0x80) out.push(c);
      else if (c < 0x800) out.push(0xc0 | (c >> 6), 0x80 | (c & 63));
      else if (c < 0xd800 || c >= 0xe000) out.push(0xe0 | (c >> 12), 0x80 | ((c >> 6) & 63), 0x80 | (c & 63));
      else { // surrogate pair
        i++;
        var cp = 0x10000 + (((c & 0x3ff) << 10) | (str.charCodeAt(i) & 0x3ff));
        out.push(0xf0 | (cp >> 18), 0x80 | ((cp >> 12) & 63), 0x80 | ((cp >> 6) & 63), 0x80 | (cp & 63));
      }
    }
    return out;
  }

  function pickVersion(byteLen) {
    for (var v = 1; v <= 10; v++) {
      var spec = SPEC[v], total = 0;
      spec[1].forEach(function (g) { total += g[0] * g[1]; });
      var countBits = v < 10 ? 8 : 16;
      if (byteLen * 8 + 4 + countBits <= total * 8) return v;
    }
    throw new Error('QR: 데이터가 너무 깁니다 (최대 약 210자)');
  }

  function buildCodewords(bytes, version) {
    var spec = SPEC[version], ecLen = spec[0], groups = spec[1];
    var totalData = 0;
    groups.forEach(function (g) { totalData += g[0] * g[1]; });

    var bb = new BitBuf();
    bb.put(4, 4);                                   // byte 모드
    bb.put(bytes.length, version < 10 ? 8 : 16);    // 길이
    for (var i = 0; i < bytes.length; i++) bb.put(bytes[i], 8);
    // 종단자 + 바이트 정렬
    var cap = totalData * 8;
    for (var t = 0; t < 4 && bb.bits.length < cap; t++) bb.bits.push(0);
    while (bb.bits.length % 8) bb.bits.push(0);
    // 패딩
    var pad = [0xec, 0x11], p = 0;
    var data = [];
    for (var b = 0; b < bb.bits.length; b += 8) {
      var v8 = 0;
      for (var k = 0; k < 8; k++) v8 = (v8 << 1) | bb.bits[b + k];
      data.push(v8);
    }
    while (data.length < totalData) data.push(pad[p++ % 2]);

    // 블록 분할
    var blocks = [], ecBlocks = [], idx = 0;
    groups.forEach(function (g) {
      for (var n = 0; n < g[0]; n++) {
        var chunk = data.slice(idx, idx + g[1]); idx += g[1];
        blocks.push(chunk);
        ecBlocks.push(rsEncode(chunk, ecLen));
      }
    });

    // 인터리브
    var out = [], maxD = Math.max.apply(null, blocks.map(function (b) { return b.length; }));
    for (var c = 0; c < maxD; c++)
      for (var bi = 0; bi < blocks.length; bi++)
        if (c < blocks[bi].length) out.push(blocks[bi][c]);
    for (var e = 0; e < ecLen; e++)
      for (var bj = 0; bj < ecBlocks.length; bj++) out.push(ecBlocks[bj][e]);
    return out;
  }

  // ---- 매트릭스 ----
  function makeMatrix(version) {
    var size = version * 4 + 17;
    var m = [], res = [];
    for (var i = 0; i < size; i++) { m.push(new Array(size).fill(null)); res.push(new Array(size).fill(false)); }

    function finder(r, c) {
      for (var dr = -1; dr <= 7; dr++) for (var dc = -1; dc <= 7; dc++) {
        var rr = r + dr, cc = c + dc;
        if (rr < 0 || rr >= size || cc < 0 || cc >= size) continue;
        var on = (dr >= 0 && dr <= 6 && (dc === 0 || dc === 6)) ||
                 (dc >= 0 && dc <= 6 && (dr === 0 || dr === 6)) ||
                 (dr >= 2 && dr <= 4 && dc >= 2 && dc <= 4);
        m[rr][cc] = on; res[rr][cc] = true;
      }
    }
    finder(0, 0); finder(0, size - 7); finder(size - 7, 0);

    // 타이밍 패턴
    for (var i2 = 8; i2 < size - 8; i2++) {
      m[6][i2] = (i2 % 2 === 0); res[6][i2] = true;
      m[i2][6] = (i2 % 2 === 0); res[i2][6] = true;
    }
    // 정렬 패턴
    var ap = ALIGN[version], last = ap.length - 1;
    for (var a = 0; a < ap.length; a++) for (var b = 0; b < ap.length; b++) {
      // 세 파인더와 겹치는 모서리 세 자리만 건너뜁니다.
      // (행 6 / 열 6 위의 정렬 패턴은 타이밍 패턴을 덮어쓰는 게 정상입니다)
      if ((a === 0 && b === 0) || (a === 0 && b === last) || (a === last && b === 0)) continue;
      var r0 = ap[a], c0 = ap[b];
      for (var dr2 = -2; dr2 <= 2; dr2++) for (var dc2 = -2; dc2 <= 2; dc2++) {
        m[r0 + dr2][c0 + dc2] = (Math.abs(dr2) === 2 || Math.abs(dc2) === 2 || (dr2 === 0 && dc2 === 0));
        res[r0 + dr2][c0 + dc2] = true;
      }
    }
    // 다크 모듈
    m[size - 8][8] = true; res[size - 8][8] = true;
    // 포맷 정보 자리 예약
    for (var f = 0; f < 9; f++) {
      if (!res[8][f]) { res[8][f] = true; m[8][f] = false; }
      if (!res[f][8]) { res[f][8] = true; m[f][8] = false; }
    }
    for (var f2 = 0; f2 < 8; f2++) {
      res[8][size - 1 - f2] = true; m[8][size - 1 - f2] = false;
      res[size - 1 - f2][8] = true; m[size - 1 - f2][8] = false;
    }
    // 버전 정보 자리 (v7+)
    if (version >= 7) {
      for (var vr = 0; vr < 6; vr++) for (var vc = 0; vc < 3; vc++) {
        res[vr][size - 11 + vc] = true; m[vr][size - 11 + vc] = false;
        res[size - 11 + vc][vr] = true; m[size - 11 + vc][vr] = false;
      }
    }
    return { m: m, res: res, size: size };
  }

  function placeData(mx, codewords) {
    var m = mx.m, res = mx.res, size = mx.size;
    var bitIdx = 0, total = codewords.length * 8;
    function bitAt(i) { return i < total ? (codewords[i >> 3] >> (7 - (i & 7))) & 1 : 0; }

    var col = size - 1, upward = true;
    while (col > 0) {
      if (col === 6) col--;                      // 타이밍 열 건너뛰기
      for (var n = 0; n < size; n++) {
        var row = upward ? size - 1 - n : n;
        for (var s = 0; s < 2; s++) {
          var c = col - s;
          if (res[row][c]) continue;
          m[row][c] = bitAt(bitIdx++) === 1;
        }
      }
      upward = !upward; col -= 2;
    }
  }

  var MASKS = [
    function (i, j) { return (i + j) % 2 === 0; },
    function (i) { return i % 2 === 0; },
    function (i, j) { return j % 3 === 0; },
    function (i, j) { return (i + j) % 3 === 0; },
    function (i, j) { return (Math.floor(i / 2) + Math.floor(j / 3)) % 2 === 0; },
    function (i, j) { return ((i * j) % 2) + ((i * j) % 3) === 0; },
    function (i, j) { return (((i * j) % 2) + ((i * j) % 3)) % 2 === 0; },
    function (i, j) { return (((i + j) % 2) + ((i * j) % 3)) % 2 === 0; }
  ];

  function bch15(data) {                       // 포맷 정보 BCH(15,5)
    var d = data << 10, g = 0x537;
    for (var i = 14; i >= 10; i--) if ((d >> i) & 1) d ^= g << (i - 10);
    return ((data << 10) | d) ^ 0x5412;
  }
  function bch18(ver) {                        // 버전 정보 BCH(18,6)
    var d = ver << 12, g = 0x1f25;
    for (var i = 17; i >= 12; i--) if ((d >> i) & 1) d ^= g << (i - 12);
    return (ver << 12) | d;
  }

  function applyFormat(mx, maskIdx) {
    var size = mx.size, m = mx.m;
    var f = bch15((0x00 << 3) | maskIdx);      // 0x00 = ECC 레벨 M, 15비트(bit14가 MSB)
    function bit(n) { return ((f >> n) & 1) === 1; }

    // 사본 1 — 좌상단 파인더 둘레. MSB(bit14)부터 이 순서대로 놓입니다.
    var p1 = [[8,0],[8,1],[8,2],[8,3],[8,4],[8,5],[8,7],[8,8],
              [7,8],[5,8],[4,8],[3,8],[2,8],[1,8],[0,8]];
    for (var i = 0; i < 15; i++) m[p1[i][0]][p1[i][1]] = bit(14 - i);

    // 사본 2 — 좌하단 세로 7칸 + 우상단 가로 8칸
    var p2 = [];
    for (var r = 0; r < 7; r++) p2.push([size - 1 - r, 8]);
    for (var c = 0; c < 8; c++) p2.push([8, size - 8 + c]);
    for (var j = 0; j < 15; j++) m[p2[j][0]][p2[j][1]] = bit(14 - j);

    m[size - 8][8] = true;                     // 다크 모듈
  }

  function applyVersion(mx, version) {
    if (version < 7) return;
    var bits = bch18(version), size = mx.size;
    for (var i = 0; i < 18; i++) {
      var on = ((bits >> i) & 1) === 1;
      var r = Math.floor(i / 3), c = i % 3;
      mx.m[r][size - 11 + c] = on;
      mx.m[size - 11 + c][r] = on;
    }
  }

  function penalty(m, size) {
    var p = 0, i, j, run, dark = 0;
    // 규칙 1: 같은 색 연속
    for (i = 0; i < size; i++) {
      run = 1;
      for (j = 1; j < size; j++) {
        if (m[i][j] === m[i][j - 1]) { run++; if (run === 5) p += 3; else if (run > 5) p++; }
        else run = 1;
      }
      run = 1;
      for (j = 1; j < size; j++) {
        if (m[j][i] === m[j - 1][i]) { run++; if (run === 5) p += 3; else if (run > 5) p++; }
        else run = 1;
      }
    }
    // 규칙 2: 2x2 블록
    for (i = 0; i < size - 1; i++) for (j = 0; j < size - 1; j++)
      if (m[i][j] === m[i][j + 1] && m[i][j] === m[i + 1][j] && m[i][j] === m[i + 1][j + 1]) p += 3;
    // 규칙 3: 1:1:3:1:1 패턴
    var pat = [true, false, true, true, true, false, true, false, false, false, false];
    var pat2 = [false, false, false, false, true, false, true, true, true, false, true];
    function match(get, n) {
      var c = 0;
      for (var a = 0; a + 11 <= n; a++) {
        var ok1 = true, ok2 = true;
        for (var b = 0; b < 11; b++) {
          if (get(a + b) !== pat[b]) ok1 = false;
          if (get(a + b) !== pat2[b]) ok2 = false;
        }
        if (ok1 || ok2) c++;
      }
      return c;
    }
    for (i = 0; i < size; i++) {
      p += 40 * match(function (k) { return m[i][k]; }, size);
      p += 40 * match(function (k) { return m[k][i]; }, size);
    }
    // 규칙 4: 흑백 비율
    for (i = 0; i < size; i++) for (j = 0; j < size; j++) if (m[i][j]) dark++;
    var pct = dark * 100 / (size * size);
    p += Math.floor(Math.abs(pct - 50) / 5) * 10;
    return p;
  }

  function encode(text) {
    var bytes = utf8Bytes(text);
    var version = pickVersion(bytes.length);
    var codewords = buildCodewords(bytes, version);

    var best = null, bestScore = Infinity;
    for (var mi = 0; mi < 8; mi++) {
      var mx = makeMatrix(version);
      placeData(mx, codewords);
      // 마스크 적용 (기능 패턴 제외)
      for (var r = 0; r < mx.size; r++) for (var c = 0; c < mx.size; c++)
        if (!mx.res[r][c] && MASKS[mi](r, c)) mx.m[r][c] = !mx.m[r][c];
      applyFormat(mx, mi);
      applyVersion(mx, version);
      var s = penalty(mx.m, mx.size);
      if (s < bestScore) { bestScore = s; best = mx; }
    }
    return best;
  }

  function draw(canvas, text, fg, bg) {
    fg = fg || '#000'; bg = bg || '#fff';
    var mx = encode(text), size = mx.size, quiet = 4;
    var px = Math.max(1, Math.floor(canvas.width / (size + quiet * 2)));
    var dim = px * (size + quiet * 2);
    canvas.width = dim; canvas.height = dim;
    var ctx = canvas.getContext('2d');
    ctx.fillStyle = bg; ctx.fillRect(0, 0, dim, dim);
    ctx.fillStyle = fg;
    for (var r = 0; r < size; r++) for (var c = 0; c < size; c++)
      if (mx.m[r][c]) ctx.fillRect((c + quiet) * px, (r + quiet) * px, px, px);
    return canvas;
  }

  return { draw: draw, encode: encode };
})();
</script>
<style>
:root{--bg:#0b0d17;--card:#161a2b;--line:#272c45;--ink:#f2f4ff;--dim:#8b93b8;--accent:#6c7bff;
      --win:#34d399;--lose:#f87171;--gold:#fbbf24;--silver:#cbd5e1;--bronze:#d97757;--ok:#34d399;--bad:#f87171}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);
  font-family:'Pretendard',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;
  display:flex;flex-direction:column;min-height:100dvh;transition:background .4s;
  padding:max(16px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom))}
/* 호스트 모드 — 화면 꽉 채우기 */
body.host{padding:0;height:100vh;overflow:hidden;
  background:radial-gradient(1200px 700px at 50% -10%,#1a2040 0%,var(--bg) 60%)}
body.host .wrap,body.host .foot{display:none}
.wrap{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:18px;
  text-align:center;max-width:460px;margin:0 auto;width:100%}
h1{font-size:1.45rem;margin:0;font-weight:800;letter-spacing:-.02em}
.sub{color:var(--dim);font-size:.95rem;margin:0;line-height:1.5}
.emoji{font-size:clamp(4rem,26vw,7rem);line-height:1;margin:0;user-select:none;-webkit-user-select:none}
input{width:100%;padding:16px 18px;font-size:1.1rem;border-radius:14px;
  border:1px solid var(--line);background:var(--card);color:var(--ink);outline:none;font-family:inherit}
input:focus{border-color:var(--accent)}
input.code{text-transform:uppercase;letter-spacing:.2em;font-weight:800;text-align:center;font-family:ui-monospace,Menlo,monospace}
button{font-family:inherit;font-weight:800;border:0;border-radius:14px;cursor:pointer;
  background:var(--accent);color:#fff;padding:16px 22px;font-size:1.1rem;width:100%}
button:disabled{opacity:.45}
button.ghost{background:transparent;border:1px solid var(--line);color:var(--dim)}
button.link{background:transparent;color:var(--dim);font-size:.9rem;font-weight:700;padding:8px;width:auto}
button.link:hover{color:var(--ink)}
.badge{display:inline-block;padding:5px 13px;border-radius:999px;background:var(--card);
  border:1px solid var(--line);color:var(--dim);font-size:.82rem;font-weight:700}
.badge.prize{border-color:#5a4a12;background:#1d1805;color:var(--gold)}
.badge.practice{border-color:#2a3350;color:#7f88b0}
.badge .brand{height:1.5em;width:auto;vertical-align:middle;margin-right:.2em;border-radius:50%}
.err{color:var(--lose);font-size:.88rem;min-height:1.2em;margin:0}

/* 입구 카드 */
.card{width:100%;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px;
  display:flex;flex-direction:column;gap:12px}
.card input{background:#0d1120}
.or{color:var(--dim);font-size:.8rem;margin:2px 0}
.joinrow{display:flex;gap:8px}
.joinrow input{flex:1;min-width:0}
.joinrow button{width:auto;padding:16px 20px;white-space:nowrap}

/* 호스트 모드 키패드 */
.pinDots{font-size:1.6rem;letter-spacing:.3em;font-weight:900;color:var(--ink);min-height:1.4em;text-align:center}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.keypad button{padding:16px 0;font-size:1.25rem;width:100%}
.keypad #mkPrize{font-size:1rem}
/* PIN 모달 */
.modal{position:fixed;inset:0;z-index:30;background:rgba(7,9,18,.85);display:flex;align-items:center;justify-content:center;padding:4vh 16px;overflow:auto}
.mbox{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:22px;width:min(420px,100%);
  display:flex;flex-direction:column;gap:14px;text-align:center}
.mbox h2{margin:0;font-size:1.15rem;font-weight:900}
.mbox .btns{display:flex;gap:8px}
.mbox.wide{width:min(980px,100%);text-align:left;max-height:92vh;overflow:auto}


/* ===== 호스트 화면 ===== */
.hscreen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;gap:2.2vh;
  padding:3vh 4vw calc(90px + env(safe-area-inset-bottom));text-align:center;overflow:auto}
.hscreen>:first-child{margin-top:auto}.hscreen>:last-child{margin-bottom:auto}
.hide{display:none!important}
.hscreen h1{font-size:clamp(1.8rem,4.6vw,3.6rem);font-weight:900;letter-spacing:-.03em}
.hsub{color:var(--dim);font-size:clamp(1rem,2vw,1.6rem);margin:0;line-height:1.5}
.hsub b{color:var(--ink)}
.lbl{color:var(--dim);font-size:clamp(.9rem,1.6vw,1.3rem);font-weight:800;letter-spacing:.14em}
.codebig{cursor:default;user-select:none;-webkit-user-select:none;font-family:ui-monospace,Menlo,monospace;font-size:clamp(3rem,9vw,7rem);font-weight:900;letter-spacing:.14em;line-height:1;color:var(--accent)}
.qrbox{background:#fff;padding:18px;border-radius:22px;display:flex}
.qrbox canvas{display:block;width:min(42vh,440px);height:min(42vh,440px)}
.url{font-family:ui-monospace,Menlo,monospace;font-size:clamp(.8rem,1.3vw,1.05rem);color:var(--dim);word-break:break-all;max-width:40ch;margin:0}
.hbadges{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.hbadges .badge{font-size:clamp(.9rem,1.6vw,1.25rem);padding:.4em 1.1em}

<script>
/* ===================== 설정 ===================== */
const CONFIG = {
  SUPABASE_URL: 'https://hvanvcjmnbalgghdiopn.supabase.co',
  SUPABASE_ANON_KEY: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imh2YW52Y2ptbmJhbGdnaGRpb3BuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODMwMTA4MTgsImV4cCI6MjA5ODU4NjgxOH0.eZA-hYu0JFlwmSvtRR3tX9COl9qI2tf9qpc4CbAz6qA',
  // 방 만들기·시작·결과 전송에 쓰는 호스트 키. 쿠폰이 걸린 방은 이와 별도로 PIN(마스터 비밀번호)이 있어야 만들어진다.
  HOST_KEY: 'race2026',
  HOST_NAME: '메이븐',       // 호스트 모드(주사위 7번)에서 쓰는 방장 이름 — 타이핑 없이 방을 만들 수 있게
  JOIN_BASE: location.origin + location.pathname.replace(/[^/]*$/, ''),
  POLL_MS: 2500,          // 참가자 폴링
  LOBBY_POLL_MS: 2000,    // 호스트 대기실 인원 갱신
  WINNERS: 3,
  MAX_RACE_SEC: 45        // 이 시간이 지나면 현재 순서로 마감 (구슬이 걸렸을 때 대비)
};
/* =============================================== */

/* ---------------- 물리 파라미터 ---------------- */
const W        = 2000;    // 월드 가로 (고정)
const R        = 12;     // 구슬 반지름
const PEG_R    = 8;
const COLS     = 20;      // 못 열 개수
const ROW_H    = 78;      // 못 줄 간격
const ROWS     = 32;      // 못 줄 수 (레이스 길이)
const TOP_Y    = 420;     // 첫 못 줄 y
const GRAV     = 560;     // px/s²
const REST_PEG = 0.50;    // 못 반발
const REST_W   = 0.45;    // 벽 반발
const REST_M   = 0.22;    // 구슬끼리 반발
const DAMP     = 0.9975;
const MAX_V    = 1400;
const SUB      = 3;       // 프레임당 물리 서브스텝
const REST_SEG  = 0.45;   // 경사판·회전바 반발
const REST_BUMP = 0.92;   // 범퍼 반발 (크게 튕김)
let   GOAL_Y    = 0;      // 코스를 만들면서 정해집니다
const VISIBLE_H = 1125;    // 화면에 담을 세로 월드 높이

const cv = document.getElementById('cv');
const ctx = cv.getContext('2d', { alpha: false });
let VIEW = { w: 0, h: 0, dpr: 1 };

let marbles = [], finished = [], running = false, raceT = 0, camY = 0, lastT = 0;
let grid = null, cellSize = 0, cols = 0, rows = 0;

/* ---------------- 코스 ---------------- */
// 장애물 종류: peg(못) · seg(경사판) · spin(회전바) · bump(범퍼)
let obs = [];

function addPegBand(y, rows) {
  const sp = W / COLS;
  for (let i = 0; i < rows; i++) {
    const yy = y + i * ROW_H;
    const off = (i % 2) ? sp / 2 : 0;
    for (let j = 0; j <= COLS; j++) {
      const x = j * sp + off;
      if (x < 14 || x > W - 14) continue;
      obs.push({ t: 'peg', x, y: yy, r: PEG_R });
    }
  }
  return rows * ROW_H;
}

// 짧은 빗면을 어긋나게 흩뿌립니다.
// 전폭 경사판은 구슬 전부를 한 점으로 몰아 병목을 만들기 때문에 쓰지 않습니다.
function addRampBand(y, n) {
  const H = 200;
  const len = W * 0.26;
  for (let i = 0; i < n; i++) {
    const yy = y + i * H + 40;
    const k = 3;                                   // 한 줄에 빗면 3개
    for (let j = 0; j < k; j++) {
      const slot = W / k;
      const cx = slot * j + slot * 0.5 + ((i % 2) ? slot * 0.28 : -slot * 0.28);
      const down = ((i + j) % 2 === 0) ? 1 : -1;   // 왼쪽/오른쪽으로 번갈아 흘림
      const drop = len * 0.55;                     // 약 29도
      obs.push({ t: 'seg',
        ax: cx - len / 2, ay: yy + (down > 0 ? 0 : drop),
        bx: cx + len / 2, by: yy + (down > 0 ? drop : 0), r: 9 });
    }
  }
  return n * H + 120;
}

// 회전하는 바 — 구슬을 퍼올려 튕겨냅니다 (가장 큰 변수)
function addSpinBand(y, n) {
  const H = 300;
  const gap = W / (n + 1);
  for (let i = 0; i < n; i++) {
    obs.push({
      t: 'spin', x: gap * (i + 1), y: y + H * 0.5,
      len: gap * 0.78, r: 8,
      a: Math.random() * Math.PI,
      w: (i % 2 ? 1 : -1) * (1.3 + Math.random() * 0.7)   // rad/s
    });
  }
  return H;
}

// 큰 범퍼 — 반발이 커서 멀리 튕겨나갑니다
function addBumpBand(y, n) {
  const H = 300;
  const gap = W / (n + 1);
  for (let i = 0; i < n; i++) {
    obs.push({ t: 'bump', x: gap * (i + 1) + (i % 2 ? -40 : 40),
               y: y + H * (i % 2 ? 0.34 : 0.62), r: 34 });
  }
  return H;
}

// 마지막 깔때기 — 가운데로 모아 결승선으로
function addFunnel(y) {
  const H = 420;
  const mouth = W * 0.16;
  obs.push({ t: 'seg', ax: 0,     ay: y,        bx: W / 2 - mouth, by: y + H - 70, r: 10 });
  obs.push({ t: 'seg', ax: W,     ay: y,        bx: W / 2 + mouth, by: y + H - 70, r: 10 });
  return H;
}

const PLAN = ['peg3', 'ramp2', 'peg3', 'spin', 'peg2', 'bump', 'ramp2', 'peg3', 'spin', 'peg2', 'funnel'];

function buildCourse() {
  obs = [];
  let y = TOP_Y;
  for (const step of PLAN) {
    if (step === 'peg3')        y += addPegBand(y, 3);
    else if (step === 'peg2')   y += addPegBand(y, 2);
    else if (step === 'ramp2')  y += addRampBand(y, 2);
    else if (step === 'spin')   y += addSpinBand(y, 4);
    else if (step === 'bump')   y += addBumpBand(y, 5);
    else if (step === 'funnel') y += addFunnel(y);
    y += 40;
  }
  GOAL_Y = y + 120;

  // 충돌 조회용 격자 — 장애물이 닿을 수 있는 모든 칸에 넣습니다
  cellSize = 180;
  cols = Math.ceil(W / cellSize);
  rows = Math.ceil((GOAL_Y + 500) / cellSize);
  grid = Array.from({ length: cols * rows }, () => []);
  const put = (o, x0, y0, x1, y1) => {
    const c0 = Math.max(0, Math.floor(x0 / cellSize)), c1 = Math.min(cols - 1, Math.floor(x1 / cellSize));
    const r0 = Math.max(0, Math.floor(y0 / cellSize)), r1 = Math.min(rows - 1, Math.floor(y1 / cellSize));
    for (let r = r0; r <= r1; r++) for (let c = c0; c <= c1; c++) grid[r * cols + c].push(o);
  };
  for (const o of obs) {
    if (o.t === 'peg' || o.t === 'bump') put(o, o.x - o.r, o.y - o.r, o.x + o.r, o.y + o.r);
    else if (o.t === 'spin') { const e = o.len / 2 + o.r; put(o, o.x - e, o.y - e, o.x + e, o.y + e); }
    else put(o, Math.min(o.ax, o.bx) - o.r, Math.min(o.ay, o.by) - o.r,
                Math.max(o.ax, o.bx) + o.r, Math.max(o.ay, o.by) + o.r);
  }
}

function obsNear(x, y) {
  const c = Math.floor(x / cellSize), r = Math.floor(y / cellSize), out = [];
  for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) {
    const rr = r + dr, cc = c + dc;
    if (rr < 0 || rr >= rows || cc < 0 || cc >= cols) continue;
    const cell = grid[rr * cols + cc];
    for (let i = 0; i < cell.length; i++) if (out.indexOf(cell[i]) < 0) out.push(cell[i]);
  }
  return out;
}

/* ---------------- 충돌 ---------------- */
// 원(구슬) ↔ 원(못·범퍼)
function hitCircle(m, cx, cy, rad, rest) {
  let dx = m.x - cx, dy = m.y - cy;
  const rr = R + rad;
  let d2 = dx * dx + dy * dy;
  if (d2 >= rr * rr) return;
  let d = Math.sqrt(d2) || 0.0001;
  if (d < 0.01) { dx = Math.random() - .5; dy = -1; d = 1; }
  const nx = dx / d, ny = dy / d;
  m.x = cx + nx * rr; m.y = cy + ny * rr;
  const vn = m.vx * nx + m.vy * ny;
  if (vn < 0) {
    m.vx -= (1 + rest) * vn * nx;
    m.vy -= (1 + rest) * vn * ny;
    m.vx += (Math.random() - .5) * 18;
  }
}

// 원(구슬) ↔ 두께 있는 선분(경사판·회전바). vpx/vpy 는 접촉점의 속도(회전바용)
function hitSeg(m, ax, ay, bx, by, rad, rest, vpx, vpy) {
  const abx = bx - ax, aby = by - ay;
  const L2 = abx * abx + aby * aby || 1;
  let t = ((m.x - ax) * abx + (m.y - ay) * aby) / L2;
  t = t < 0 ? 0 : t > 1 ? 1 : t;
  const cx = ax + abx * t, cy = ay + aby * t;
  let dx = m.x - cx, dy = m.y - cy;
  const rr = R + rad;
  let d2 = dx * dx + dy * dy;
  if (d2 >= rr * rr) return;
  let d = Math.sqrt(d2) || 0.0001;
  if (d < 0.01) { dx = Math.random() - .5; dy = -1; d = 1; }
  const nx = dx / d, ny = dy / d;
  m.x = cx + nx * rr; m.y = cy + ny * rr;
  const rvx = m.vx - (vpx || 0), rvy = m.vy - (vpy || 0);
  const vn = rvx * nx + rvy * ny;
  if (vn < 0) {
    m.vx -= (1 + rest) * vn * nx;
    m.vy -= (1 + rest) * vn * ny;
    if (vpx || vpy) { m.vx += vpx * 0.5; m.vy += vpy * 0.5; }   // 회전바가 밀어줌
  }
}

function collide(m) {
  const near = obsNear(m.x, m.y);
  for (let i = 0; i < near.length; i++) {
    const o = near[i];
    if (o.t === 'peg')       hitCircle(m, o.x, o.y, o.r, REST_PEG);
    else if (o.t === 'bump') hitCircle(m, o.x, o.y, o.r, REST_BUMP);
    else if (o.t === 'seg')  hitSeg(m, o.ax, o.ay, o.bx, o.by, o.r, REST_SEG);
    else if (o.t === 'spin') {
      const ca = Math.cos(o.a), sa = Math.sin(o.a), hl = o.len / 2;
      const ax = o.x - ca * hl, ay = o.y - sa * hl;
      const bx = o.x + ca * hl, by = o.y + sa * hl;
      // 접촉점 근사치의 회전 속도
      const px = m.x - o.x, py = m.y - o.y;
      hitSeg(m, ax, ay, bx, by, o.r, REST_SEG, -o.w * py, o.w * px);
    }
  }
}

function spinStep(dt) {
  for (let i = 0; i < obs.length; i++) if (obs[i].t === 'spin') obs[i].a += obs[i].w * dt;
}

/* ---------------- 장애물 그리기 ---------------- */
function drawObstacles(top, bot) {
  for (const o of obs) {
    if (o.t === 'peg') {
      if (o.y < top - 30 || o.y > bot + 30) continue;
      ctx.fillStyle = '#1b2138';
      ctx.beginPath(); ctx.arc(o.x, o.y, o.r, 0, 6.2832); ctx.fill();
    } else if (o.t === 'bump') {
      if (o.y < top - 60 || o.y > bot + 60) continue;
      ctx.beginPath(); ctx.arc(o.x, o.y, o.r, 0, 6.2832);
      ctx.fillStyle = '#2a2150'; ctx.fill();
      ctx.strokeStyle = '#7c6cff'; ctx.lineWidth = 3; ctx.stroke();
    } else if (o.t === 'seg') {
      if (Math.max(o.ay, o.by) < top - 60 || Math.min(o.ay, o.by) > bot + 60) continue;
      ctx.strokeStyle = '#2b3357'; ctx.lineWidth = o.r * 2; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(o.ax, o.ay); ctx.lineTo(o.bx, o.by); ctx.stroke();
    } else if (o.t === 'spin') {
      if (o.y < top - 120 || o.y > bot + 120) continue;
      const ca = Math.cos(o.a), sa = Math.sin(o.a), hl = o.len / 2;
      ctx.strokeStyle = '#4a5cc4'; ctx.lineWidth = o.r * 2; ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(o.x - ca * hl, o.y - sa * hl);
      ctx.lineTo(o.x + ca * hl, o.y + sa * hl);
      ctx.stroke();
      ctx.fillStyle = '#8b93b8';
      ctx.beginPath(); ctx.arc(o.x, o.y, 5, 0, 6.2832); ctx.fill();
    }
  }
}

/* ---------------- 구슬 ---------------- */
function hueFor(i, n) { return (i * 360 / Math.max(1, n) + (i % 3) * 17) % 360; }

function setupMarbles(players) {
  marbles = []; finished = [];
  const n = players.length;
  const perRow = Math.min(30, Math.max(6, Math.ceil(Math.sqrt(n * 3.0))));
  const sp = (W - 140) / perRow;
  players.forEach((p, i) => {
    const r = Math.floor(i / perRow), c = i % perRow;
    marbles.push({
      i, id: p.id, name: p.nick,
      x: 70 + sp * (c + .5) + (Math.random() - .5) * sp * .35,
      y: 40 - r * (R * 3.4) - Math.random() * 10,
      vx: (Math.random() - .5) * 30, vy: 0,
      color: `hsl(${hueFor(i, n)} 78% 58%)`,
      done: false, rank: 0
    });
  });
}

/* ---------------- 물리 ---------------- */
function step(dt) {
  const n = marbles.length;
  spinStep(dt);
  for (let s = 0; s < SUB; s++) {
    const h = dt / SUB;
    for (let k = 0; k < n; k++) {
      const m = marbles[k];
      if (m.done) continue;
      m.vy += GRAV * h;
      m.vx *= DAMP; m.vy *= DAMP;
      const sp2 = m.vx * m.vx + m.vy * m.vy;
      if (sp2 > MAX_V * MAX_V) { const f = MAX_V / Math.sqrt(sp2); m.vx *= f; m.vy *= f; }
      m.x += m.vx * h; m.y += m.vy * h;

      // 벽
      if (m.x < R)      { m.x = R;     m.vx = Math.abs(m.vx) * REST_W; }
      if (m.x > W - R)  { m.x = W - R; m.vx = -Math.abs(m.vx) * REST_W; }

      collide(m);
    }

    // 구슬끼리 (같은 줄 근처만 비교 — 정렬 기반 스윕)
    marbles.sort((a, b) => a.y - b.y);
    const dd = R * 2;
    for (let a = 0; a < n; a++) {
      const A = marbles[a];
      if (A.done) continue;
      for (let b = a + 1; b < n; b++) {
        const B = marbles[b];
        if (B.y - A.y > dd) break;
        if (B.done) continue;
        let dx = B.x - A.x, dy = B.y - A.y;
        const d2 = dx * dx + dy * dy;
        if (d2 >= dd * dd || d2 === 0) continue;
        const d = Math.sqrt(d2);
        const nx = dx / d, ny = dy / d;
        const overlap = (dd - d) * 0.5;
        A.x -= nx * overlap; A.y -= ny * overlap;
        B.x += nx * overlap; B.y += ny * overlap;
        const rvn = (B.vx - A.vx) * nx + (B.vy - A.vy) * ny;
        if (rvn < 0) {
          const j = -(1 + REST_M) * rvn * 0.5;
          A.vx -= j * nx; A.vy -= j * ny;
          B.vx += j * nx; B.vy += j * ny;
        }
      }
    }

    // 골인
    for (let k = 0; k < n; k++) {
      const m = marbles[k];
      if (!m.done && m.y >= GOAL_Y) {
        m.done = true; m.rank = finished.length + 1;
        finished.push(m);
        announce(m);
        if (finished.length >= winnersNeeded()) { running = false; return; }
      }
    }
  }
}

/* ---------------- 그리기 ---------------- */
function resize() {
  const dpr = Math.min(1.25, window.devicePixelRatio || 1);   // 2배 해상도는 픽셀이 4배라 저사양 노트북에서 밀린다
  const rect = cv.getBoundingClientRect();
  if (rect.width < 2 || rect.height < 2) return;   // 숨겨진 상태(0×0)면 건드리지 않는다 — 0 이 박히면 레이스가 빈 화면이 된다
  cv.width = Math.round(rect.width * dpr);
  cv.height = Math.round(rect.height * dpr);
  VIEW = { w: rect.width, h: rect.height, dpr };
}

function draw() {
  const { w, h, dpr } = VIEW;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = '#070912';
  ctx.fillRect(0, 0, w, h);

  // 세로 1100 월드픽셀이 보이도록 맞춥니다 (선두 그룹이 한 화면에 들어옴)
  const scale = Math.min(w / W, h / VISIBLE_H);
  const offX = (w - W * scale) / 2;
  // 카메라: 선두 구슬을 화면 위쪽 1/3 지점에 둡니다
  let lead = 0;
  for (const m of marbles) if (!m.done && m.y > lead) lead = m.y;
  const targetCam = Math.max(0, lead - (h / scale) * 0.62);
  camY += (targetCam - camY) * 0.12;

  ctx.save();
  ctx.translate(offX, 0);
  ctx.scale(scale, scale);
  ctx.translate(0, -camY);
  const top = camY, bot = camY + h / scale;

  drawObstacles(top, bot);
  // 결승선
  if (GOAL_Y > top - 40 && GOAL_Y < bot + 40) {
    ctx.fillStyle = '#6c7bff';
    ctx.fillRect(0, GOAL_Y, W, 6);
    ctx.font = '700 34px system-ui,sans-serif';
    ctx.fillStyle = '#8b93b8'; ctx.textAlign = 'center';
    ctx.fillText('FINISH', W / 2, GOAL_Y + 52);
  }
  // 구슬
  for (const m of marbles) {
    if (m.done) continue;
    if (m.y < top - 40 || m.y > bot + 40) continue;
    ctx.beginPath(); ctx.arc(m.x, m.y, R, 0, 6.2832);
    ctx.fillStyle = m.color; ctx.fill();
  }
  // 선두 5명만 이름표 — 150개를 다 쓰면 아무것도 안 읽힙니다
  const lead5 = marbles.filter(m => !m.done).sort((a, b) => b.y - a.y).slice(0, 5);
  ctx.font = '800 26px system-ui,sans-serif';
  ctx.textAlign = 'left';
  const placed = [];
  lead5.forEach((m, i) => {
    const label = m.name;
    const tw = ctx.measureText(label).width;
    let lx = m.x + R + 10, ly = m.y + 9;
    if (lx + tw > W - 8) lx = m.x - R - 10 - tw;
    // 먼저 놓인 라벨과 겹치면 아래로 밀어냅니다
    for (let g = 0; g < 12; g++) {
      const hit = placed.some(q => Math.abs(q.y - ly) < 34 && lx < q.x + q.w + 12 && lx + tw > q.x - 12);
      if (!hit) break;
      ly += 36;
    }
    placed.push({ x: lx, y: ly, w: tw });
    ctx.strokeStyle = 'rgba(255,255,255,.28)'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(m.x, m.y); ctx.lineTo(lx - 4, ly - 8); ctx.stroke();
    ctx.fillStyle = 'rgba(7,9,18,.82)';
    ctx.fillRect(lx - 7, ly - 24, tw + 14, 32);
    ctx.fillStyle = i === 0 ? '#fbbf24' : '#e6e9ff';
    ctx.fillText(label, lx, ly);
    ctx.beginPath(); ctx.arc(m.x, m.y, R + 4, 0, 6.2832);
    ctx.strokeStyle = i === 0 ? '#fbbf24' : 'rgba(255,255,255,.55)';
    ctx.lineWidth = 2.5; ctx.stroke();
  });
  ctx.restore();

  // 남은 거리 게이지
  const prog = Math.min(1, Math.max(0, lead / GOAL_Y));
  ctx.fillStyle = '#161c31'; ctx.fillRect(0, 0, w, 6);
  ctx.fillStyle = '#6c7bff';  ctx.fillRect(0, 0, w * prog, 6);
}

  NOT_FINISHED:         '아직 결과가 나오지 않았습니다.'
};
function errMsg(e, fallback) {
  const m = String(e && e.message || '');
  for (const k in ERR) if (m.includes(k)) return ERR[k];
  return fallback;
}
async function rpc(fn, args = {}) {
  const res = await fetch(`${CONFIG.SUPABASE_URL}/rest/v1/rpc/${fn}`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', apikey: CONFIG.SUPABASE_ANON_KEY,
               Authorization: `Bearer ${CONFIG.SUPABASE_ANON_KEY}` },
    body: JSON.stringify(args)
  });
  const t = await res.text();
  if (!res.ok) {
    let msg = t;
    try { msg = JSON.parse(t).message || t; } catch (_) {}
    throw new Error(msg || res.statusText);
  }
  return t ? JSON.parse(t) : null;
}
const HOST_TOKEN_KEY = 'marble_host_token'; // 방 비밀 토큰 — 서버가 방 생성 시 만든 기기에만 준다
// 호스트 RPC — 호스트 키 + 방 토큰을 붙인다. 토큰은 방을 만든 기기만 갖고 있어 남의 방은 조회·조작 불가
const hostRpc = (fn, args = {}) => {
  const a = Object.assign({ p_key: CONFIG.HOST_KEY }, args);
  if (a.p_room) a.p_token = localStorage.getItem(HOST_TOKEN_KEY) || '';
  return rpc(fn, a);
};

let myId = localStorage.getItem('marble_pid') || null;
let lastPhase = null;
let timer = null;

// 방 코드별 참가 세션 — 같은 방에 다시 들어오면 새로 참가하지 않고 이 세션으로 복귀 (중복 참가 방지)
const SESS_KEY = 'marble_sessions';
const sessions = () => { try { return JSON.parse(localStorage.getItem(SESS_KEY)) || {}; } catch (_) { return {}; } };
function saveSession(code, pid) { const m = sessions(); m[code] = pid; localStorage.setItem(SESS_KEY, JSON.stringify(m)); }
function dropSession(code) { const m = sessions(); delete m[code]; localStorage.setItem(SESS_KEY, JSON.stringify(m)); }

function enter(pid) {
  keepAwake();
  myId = pid;
  localStorage.setItem('marble_pid', myId);
  localStorage.removeItem(OPENED_KEY);
  lastPhase = null;
  poll();
}

// 이 방에 이미 참가한 세션이 살아 있으면 그걸로 복귀. 없거나 방이 초기화됐으면 false
async function resumeSession(code) {
  const pid = sessions()[code];
  if (!pid) return false;
  try {
    const s = await rpc('marble_player_state', { p_id: pid });
    if (s && s.code === code) { enter(pid); return true; }
  } catch (_) { return false; }   // 네트워크 오류면 새로 참가하지 않고 실패로 둔다
  dropSession(code);
  return false;
}

async function joinRoom(code, nick) {
  const btn = $('join'); btn.disabled = true; btn.textContent = '입장 중…';
  try {
    if (await resumeSession(code)) return;
    const r = await rpc('marble_join_game', { p_code: code, p_nick: nick });
    saveSession(code, r.player_id);
    enter(r.player_id);
  } catch (e) {
    screenEntry(errMsg(e, '입장에 실패했습니다. 다시 시도해주세요.'));
  }
}

function screenLobby(s) {
  render(`
    <span class="badge">${s.join_count}명 입장</span>
    <p class="emoji">🎲</p>
    <h1>${esc(s.nick)} 님, 입장 완료!</h1>
    <p class="sub" style="color:var(--accent);font-size:.85rem">화면에 표시될 이름입니다</p>
    <p class="sub">곧 시작합니다.<br>앞 화면을 봐주세요.</p>
  `);
}

function screenRacing(s) {
  render(`
    <p class="emoji pop">🏁</p>
    <h1>레이스 진행 중!</h1>
    <p class="sub"><b>${esc(s.nick)}</b> 님의 구슬이 달리고 있습니다.<br>앞 화면을 봐주세요.</p>
  `);
}

function clearCurrent() {
  clearTimeout(timer);
  localStorage.removeItem('marble_pid');
  localStorage.removeItem(OPENED_KEY);
  setMedalBg(0);
  myId = null; me = null; lastPhase = null;
}
function leave() {
  clearCurrent();
  // QR 로 들어온 주소(?r=코드)를 지워서, 다른 방 코드를 넣을 수 있는 일반 입구로
  if (urlCode) { urlCode = ''; try { history.replaceState(null, '', location.pathname); } catch (_) {} }
  screenEntry();
}

async function poll() {
  if (!myId) return;
  try {
    const s = await rpc('marble_player_state', { p_id: myId });
    if (!s) return leave();
    // QR 로 다른 방에 들어온 경우 — 현재 세션을 끊고, 그 방에 참가한 적이 있으면 그 세션으로 복귀
    if (urlCode && s.code !== urlCode) {
      clearCurrent();
      if (!(await resumeSession(urlCode))) screenEntry();
      return;
    }
    // 결과 화면은 한 번만 그립니다 (상품 화면이 닫혀버리지 않도록)
    if (!(s.phase === 'result' && lastPhase === 'result')) {
      if      (s.phase === 'lobby')  screenLobby(s);
      else if (s.phase === 'racing') screenRacing(s);
      else if (s.phase === 'result') screenResult(s);
    }
    lastPhase = s.phase;
    if (s.phase !== 'result') { setMedalBg(0); localStorage.removeItem(OPENED_KEY); }
  } catch (_) { /* 순간 끊겨도 다음 폴링에서 복구 */ }
  clearTimeout(timer);
  timer = setTimeout(poll, CONFIG.POLL_MS + Math.random() * 500);
}

/* ---------- 4. 결과 ---------- */
const OPENED_KEY = 'marble_opened';   // 값 = 상품을 연 player_id
let me = null;                        // 마지막 player_state (등수·총원)

function pctLine(rank, total) {
  if (!rank || !total) return '';
  const pct = Math.ceil(rank / total * 100);
  if (pct <= 10) return `상위 ${pct}%! 아깝네요 😄`;
  if (pct <= 30) return `상위 ${pct}%`;
  if (pct <= 70) return '';
  return '완주했어요 🏁';
}
function setMedalBg(rank) {
  document.body.classList.remove('m1', 'm2', 'm3');
  if (rank >= 1 && rank <= 3) document.body.classList.add('m' + rank);
}
function confetti() {
  const box = document.createElement('div');
  box.className = 'confetti';
  const colors = ['#fbbf24', '#6c7bff', '#34d399', '#f87171', '#f2f4ff', '#fb923c'];
  for (let i = 0; i < 36; i++) {
    const c = document.createElement('i');
    c.style.left = Math.random() * 100 + 'vw';
    c.style.background = colors[i % colors.length];
    c.style.animationDelay = Math.random() * .4 + 's';
    c.style.transform = `rotate(${Math.random() * 360}deg)`;
    box.appendChild(c);
  }
  document.body.appendChild(box);
  setTimeout(() => box.remove(), 2200);
}

// phase 가 result 로 바뀌면 자동. 결과 종류(kind)를 먼저 받아 버튼을 정한다 — 바코드는 여전히 버튼을 눌러야 열린다
let reward = null;
async function screenResult(s) {
  me = s;
  setMedalBg(s.final_rank);
  render(`<p class="rank pop">${s.final_rank || '–'}<small>등</small></p><p class="sub">결과 확인 중…</p>`);
  try { reward = await rpc('marble_my_reward', { p_id: myId }); }   // 매번 서버에서 새로 받는다 (캐시 안 함)
  catch (e) {
    reward = null;
    render(`<p class="rank">${s.final_rank || '–'}<small>등</small></p>
            <p class="err">${esc(errMsg(e, '결과를 불러오지 못했습니다.'))}</p>
            <button class="goodeal-btn" id="retry">다시 확인</button>`);
    document.getElementById('retry').onclick = () => screenResult(s);
    return;
  }
  // 상품을 이미 연 적이 있으면 바코드 화면으로 바로
  if (reward.kind === 'prize' && localStorage.getItem(OPENED_KEY) === myId) return screenPrize(reward);
  screenRank(s);
}

/* 결과 화면 — 등수 + 버튼 하나. 1·2·3등(prize)은 버튼 → 바코드, 나머지는 버튼이 곧 굿딜 링크 */
function screenRank(s) {
  const r = s.final_rank, top3 = r && r <= 3;
  const pct = pctLine(r, s.total);
  const isPrize = reward && reward.kind === 'prize';
  render(`
    ${top3 ? `<p class="medal pop">${MEDAL[r - 1]}</p>` : ''}
    <p class="rank pop">${r || '–'}<small>등</small></p>
    ${top3
      ? `<p class="name">${esc(s.nick)}</p>`
      : `<p class="sub">${s.total ? `${s.total}명 중` : ''}</p>${pct ? `<p class="pct">${pct}</p>` : ''}`}
    ${isPrize
      ? `<button class="goodeal-btn" id="claim">🎁 상품 받기</button>`
      : `${reward && reward.text ? `<p class="ctext">${esc(reward.text)}</p>` : ''}
         ${reward && reward.url ? `<a class="goodeal-btn" href="${esc(reward.url)}" target="_blank" rel="noopener">플링크 7% 할인 받기</a>` : ''}`}
    ${boardToggle()}
  `);
  if (top3) confetti();
  if (isPrize) document.getElementById('claim').onclick = () => { localStorage.setItem(OPENED_KEY, myId); screenPrize(reward); };
  bindBoard();
}

function screenPrize(p) {
  render(`
    <div class="reveal">
      <p class="rank" style="font-size:2.2rem">${MEDAL[p.rank - 1] || ''} ${p.rank}<small>등</small></p>
      <p class="label">${esc(p.label || '상품')}</p>
      <div class="barcode"><img src="${p.image}" alt="쿠폰 바코드"></div>
      <p class="note">☀️ <b>화면 밝기를 최대로</b> 올려주세요<br>📸 <b>이 화면을 캡처</b>해두세요</p>
    </div>
    ${boardToggle()}
  `);
  bindBoard();
}

/* 3단계 — 전체 순위. 기본 접힘, 펼칠 때 로드 */
function boardToggle() {
  return `<button class="toggle" id="boardBtn">전체 순위 보기 ▾</button>
          <div class="board" id="board" hidden></div>
          <button class="ghost" id="leave" style="max-width:220px;font-size:.9rem;padding:12px">다른 방으로 입장</button>`;
}
function bindBoard() {
  document.getElementById('leave').onclick = leave;
  const btn = document.getElementById('boardBtn'), board = document.getElementById('board');
  let loaded = false;
  btn.onclick = async () => {
    const open = board.hidden;
    board.hidden = !open;
    btn.textContent = open ? '전체 순위 접기 ▴' : '전체 순위 보기 ▾';
    if (!open || loaded) return;
    board.innerHTML = '<p class="sub" style="padding:16px">순위 불러오는 중…</p>';
    try {
      const rows = await rpc('marble_race_results', { p_id: myId });
      board.innerHTML = rows.map(x =>
        `<div class="brow ${me && x.rank === me.final_rank ? 'me' : ''} ${x.rank <= 3 ? 'top' : ''}">
           <span class="r">${x.rank <= 3 ? MEDAL[x.rank - 1] : x.rank}</span><span class="nm">${esc(x.nick)}</span></div>`).join('');
      loaded = true;
      const mine = board.querySelector('.brow.me');
      if (mine) mine.scrollIntoView({ block: 'center' });
    } catch (_) { board.innerHTML = '<p class="sub" style="padding:16px">순위를 불러오지 못했습니다.</p>'; }
  };
}

/* ============================================================
   호스트
   ============================================================ */
const HOST_ROOM_KEY = 'marble_host_room';
const HOST_PID_KEY  = 'marble_host_pid';    // 방장 본인의 참가자 id (방장도 구슬로 달린다)
let room = null;              // marble_host_room_state 결과
let hostName = localStorage.getItem('marble_nick') || '';
let mode = 'entry';           // entry | hlobby | race | hresult
let lobbyTimer = null;
let ranksSent = false, submitting = null;
const bar = $('bar');
const HSCREENS = ['hlobby', 'race', 'hresult'];

function showHost(id) {
  mode = id;
  clearTimeout(lobbyTimer);
  document.body.classList.add('host');
  HSCREENS.forEach(s => $(s).classList.toggle('hide', s !== id));
  $('floaters').classList.toggle('hide', id !== 'hlobby');
  $('modal').classList.add('hide');
}
// 방 폭파 — 참가자를 전부 지우고 나간다. 참가자 폰은 세션이 사라진 걸 보고 입구로 돌아간다
async function closeRoom() {
  if (!confirm('방을 닫을까요? 참가자들은 모두 나가집니다.')) return;
  try { if (room) await hostRpc('marble_host_reset', { p_room: room.room_id }); }
  catch (e) { if (!confirm('참가자 정리에 실패했습니다. 그래도 나갈까요?')) return; }
  leaveHost();
}
function leaveHost() {
  clearTimeout(lobbyTimer);
  running = false;
  localStorage.removeItem(HOST_ROOM_KEY);
  localStorage.removeItem(HOST_PID_KEY);
  localStorage.removeItem(HOST_TOKEN_KEY);
  room = null; mode = 'entry';
  HSCREENS.forEach(s => $(s).classList.add('hide'));
  $('floaters').classList.add('hide');
  bar.innerHTML = '';
  document.body.classList.remove('host');
  screenEntry();
}

// 방 만들기 — 반환값이 있으면 에러 문구
async function createRoom(name, master) {
  const btn = $('create'); if (btn) { btn.disabled = true; btn.textContent = '만드는 중…'; }
  try {
    const r = await hostRpc('marble_host_create_room', { p_master: master, p_title: name });
    localStorage.setItem(HOST_TOKEN_KEY, r.host_token);
    hostName = name;
    // 방장도 같이 달린다 — 자기 방에 첫 참가자로 입장
    const j = await rpc('marble_join_game', { p_code: r.code, p_nick: name });
    localStorage.setItem(HOST_PID_KEY, j.player_id);
    await openHostRoom(r.room_id);
    return null;
  } catch (e) {
    const msg = errMsg(e, '방을 만들지 못했습니다. 다시 시도해주세요.');
    if (btn) { btn.disabled = false; btn.textContent = '방 만들기'; }
    if (!master && $('modal').classList.contains('hide')) screenEntry(msg);   // 입구의 [방 만들기] 에서 온 경우만
    return msg;
  }
}

async function openHostRoom(id) {
  try { room = await hostRpc('marble_host_room_state', { p_room: id }); }
  catch (e) {
    localStorage.removeItem(HOST_ROOM_KEY); localStorage.removeItem(HOST_PID_KEY); localStorage.removeItem(HOST_TOKEN_KEY);
    screenEntry(errMsg(e, '방을 열 수 없습니다.')); return;
  }
  localStorage.setItem(HOST_ROOM_KEY, room.room_id);
  keepAwake();
  clearTimeout(timer); myId = null;      // 이 기기는 호스트 — 참가자 폴링은 끈다
  if (room.status === 'result') showHostResult();
  else if (room.status === 'racing') startRace();   // 새로고침 등으로 끊긴 레이스 — 마감된 명단으로 다시
  else showHostLobby();
}

/* ---- 대기실 ---- */
function joinUrl() { return `${CONFIG.JOIN_BASE}?r=${room.code}`; }

function showHostLobby() {
  showHost('hlobby');
  const url = joinUrl();
  $('hlobby').innerHTML = `
    <div class="lbl">방 코드</div>
    <div class="codebig">${esc(room.code)}</div>
    <div class="qrbox" id="qr"></div>
    <p class="hsub">QR 을 스캔하거나 방 코드를 입력해서 참가 · <b id="cnt">${room.join_count}</b> 명</p>
    <div class="hbadges">
      <span class="badge">방장 : ${esc(room.title || hostName)}</span>
      ${room.is_prize ? '<span class="badge prize"><img class="brand" src="starbucks.svg" alt="" onerror="this.replaceWith(&#39;☕&#39;)"> 상품이 있어요</span>' : '<span class="badge practice">즐겜모드</span>'}
    </div>`;
  try {
    const c = document.createElement('canvas'); c.width = 1040;
    QRMini.draw(c, url, '#000000', '#ffffff');
    $('qr').appendChild(c);
  } catch (e) { $('qr').textContent = 'QR 생성 실패'; }
  $('floaters').innerHTML = ''; floaterEls = {};
  renderFloaters(room.players || []);
  bar.innerHTML = `<button class="big" id="begin">시작하기</button>
                   ${room.is_prize ? '<button class="ghost sm" id="settings">🎁 쿠폰 등록</button>' : ''}
                   <button class="ghost sm" id="hleave">나가기</button>`;
  $('begin').onclick = startRace;
  if ($('settings')) $('settings').onclick = showSettings;
  // 개발자 모드 — 방 코드를 5번 탭하면 테스트 참가자를 채운다 (폰 여러 대 없이 인원 테스트)
  let taps = 0, tapTimer = null;
  $('hlobby').querySelector('.codebig').onclick = () => {
    taps++; clearTimeout(tapTimer); tapTimer = setTimeout(() => { taps = 0; }, 3000);
    if (taps >= 5) { taps = 0; showDevMode(); }
  };
  $('hleave').onclick = closeRoom;
  pollLobby();
}

// 참가자 이름표 — 누가 들어왔는지 보이게 화면 양옆에 둥둥. 새로 온 사람은 톡 튀어나오고, 나간 사람은 빠진다
let floaterEls = {};
function renderFloaters(players) {
  const layer = $('floaters'); if (!layer) return;
  const seen = {};
  players.forEach(p => {
    seen[p.id] = true;
    if (floaterEls[p.id]) return;
    const d = document.createElement('div');
    d.className = 'fl';
    const left = Math.random() < .5;                       // QR 이 있는 가운데는 비워둔다
    d.style.left = (left ? 2 + Math.random() * 24 : 72 + Math.random() * 24) + '%';
    d.style.top  = (3 + Math.random() * 88) + '%';
    d.style.setProperty('--dx',  (Math.random() * 120 - 60).toFixed(0) + 'px');
    d.style.setProperty('--dy',  (Math.random() * 120 - 60).toFixed(0) + 'px');
    d.style.setProperty('--dx2', (Math.random() * 120 - 60).toFixed(0) + 'px');
    d.style.setProperty('--dy2', (Math.random() * 120 - 60).toFixed(0) + 'px');
    d.style.setProperty('--r',   (Math.random() * 10 + 3).toFixed(0) + 'deg');
    d.style.setProperty('--d',   (2.2 + Math.random() * 2).toFixed(1) + 's');
    d.style.setProperty('--h',   Math.floor(Math.random() * 360));   // 사람마다 다른 색
    d.innerHTML = `<span>${esc(p.nick)}</span>`;
    layer.appendChild(d);
    floaterEls[p.id] = d;
  });
  for (const id in floaterEls) if (!seen[id]) { floaterEls[id].remove(); delete floaterEls[id]; }
}

function showDevMode() {
  clearTimeout(lobbyTimer);
  $('modal').innerHTML = `<div class="mbox">
    <h2>🛠 개발자 모드</h2>
    <p class="sub">테스트 참가자를 이 방에 채웁니다 (실제 입장과 동일하게 서버에 기록)</p>
    <input type="number" id="devN" value="30" min="1" max="600" inputmode="numeric">
    <p class="err" id="devErr"></p>
    <div class="btns"><button class="ghost" id="devCancel">닫기</button><button id="devAdd">추가</button></div>
  </div>`;
  $('modal').classList.remove('hide');
  $('devCancel').onclick = () => { $('modal').classList.add('hide'); pollLobby(); };
  $('devAdd').onclick = async e => {
    const n = Math.max(1, Math.min(600, parseInt($('devN').value, 10) || 0));
    e.target.disabled = true; e.target.textContent = '추가 중…';
    const tag = Math.random().toString(36).slice(2, 5);
    let ok = 0;
    for (let i = 0; i < n; i += 20) {   // 20명씩 묶어서
      const batch = [];
      for (let k = i; k < Math.min(n, i + 20); k++)
        batch.push(rpc('marble_join_game', { p_code: room.code, p_nick: `테스트${tag}${k + 1}` }).then(() => ok++, () => {}));
      await Promise.all(batch);
    }
    toast(`${ok}명 추가됨`);
    $('modal').classList.add('hide');
    pollLobby();
  };
}

async function pollLobby() {
  if (mode !== 'hlobby') return;
  try {
    room = await hostRpc('marble_host_room_state', { p_room: room.room_id });
    const el = $('cnt'); if (el) el.textContent = room.join_count;
    renderFloaters(room.players || []);
  } catch (_) {}
  if (mode === 'hlobby') lobbyTimer = setTimeout(pollLobby, CONFIG.LOBBY_POLL_MS);
}

/* ---- 쿠폰·멘트 설정 ---- */
const PZ = [{r:1,t:'🥇 1등'},{r:2,t:'🥈 2등'},{r:3,t:'🥉 3등'}];
let prizeImgs = {};
async function showSettings() {
  clearTimeout(lobbyTimer);
  prizeImgs = {};
  let status = [];
  if (room.is_prize) { try { status = await hostRpc('marble_host_prize_status', { p_room: room.room_id }); } catch (_) {} }
  const stOf = r => status.find(s => s.rank === r);
  $('modal').innerHTML = `<div class="mbox wide">
    ${room.is_prize ? `
      <h2>🎁 쿠폰 등록</h2>
      <p class="sub">등수별 쿠폰 바코드 이미지(900KB 이하)를 올려두세요. 레이스가 끝나면 <b>해당 등수 당첨자 폰에만</b> 보입니다.<br>
         한 번 등록하면 <b>다음에 만드는 상품 방에도 자동으로 들어갑니다.</b> 이미지가 없는 등수는 당첨자도 아쉬움 멘트를 받습니다.</p>
      <div class="prizes">${PZ.map(p => { const s = stOf(p.r); return `
        <div class="pz"><h3>${p.t} <span class="st ${s && s.has_image ? 'ok' : ''}" id="st${p.r}">${s && s.has_image ? '✓ 등록됨' : '미등록'}</span></h3>
          <div class="thumb" id="th${p.r}">${s && s.has_image ? '등록된 이미지 (미리보기 없음)' : '이미지 없음'}</div>
          <input type="text" id="lb${p.r}" placeholder="쿠폰 이름 (예: 스타벅스 3만원 교환권)" value="${esc(s && s.label || '')}">
          <button class="ghost" data-r="${p.r}">이미지 선택</button>
          <input type="file" accept="image/*" id="fi${p.r}" style="display:none">
          <button data-save="${p.r}">저장</button>
        </div>`; }).join('')}</div>` : ''}
    <h2>💬 아쉬움 멘트 (4등 이하${room.is_prize ? '' : ' · 연습판은 전원'})</h2>
    <div class="field"><label>멘트</label><input type="text" id="ctext" value="${esc(room.consolation_text || '')}" maxlength="200"></div>
    <div class="field"><label>링크 (비우면 버튼 없음)</label><input type="url" id="curl" value="${esc(room.consolation_url || '')}"></div>
    <div class="btns" style="justify-content:flex-end">
      <button class="ghost" id="mclose" style="width:auto">닫기</button>
      <button id="csave" style="width:auto">멘트 저장</button>
    </div>
  </div>`;
  $('modal').classList.remove('hide');

  PZ.forEach(p => {
    const fi = $('fi' + p.r); if (!fi) return;
    $('modal').querySelector(`button[data-r="${p.r}"]`).onclick = () => fi.click();
    fi.onchange = () => {
      const f = fi.files[0]; if (!f) return;
      if (f.size > 900 * 1024) { toast('이미지가 큽니다 (900KB 이하)'); return; }
      const rd = new FileReader();
      rd.onload = () => { prizeImgs[p.r] = rd.result; $('th' + p.r).innerHTML = `<img src="${rd.result}">`; };
      rd.readAsDataURL(f);
    };
    $('modal').querySelector(`button[data-save="${p.r}"]`).onclick = async e => {
      if (!prizeImgs[p.r]) { toast('이미지를 먼저 선택하세요'); return; }
      e.target.disabled = true;
      try {
        await hostRpc('marble_host_set_prize', { p_room: room.room_id, p_rank: p.r,
          p_label: $('lb' + p.r).value.trim(), p_image: prizeImgs[p.r] });
        $('st' + p.r).textContent = '✓ 등록됨'; $('st' + p.r).classList.add('ok');
        toast(`${p.t} 쿠폰 저장 완료`);
      } catch (err) { alert(errMsg(err, '저장 실패')); }
      e.target.disabled = false;
    };
  });
  $('csave').onclick = async e => {
    e.target.disabled = true;
    try {
      await hostRpc('marble_host_set_consolation', { p_room: room.room_id,
        p_text: $('ctext').value.trim(), p_url: $('curl').value.trim() || null });
      room.consolation_text = $('ctext').value.trim(); room.consolation_url = $('curl').value.trim();
      toast('멘트 저장 완료');
    } catch (err) { alert(errMsg(err, '저장 실패')); }
    e.target.disabled = false;
  };
  $('mclose').onclick = () => { $('modal').classList.add('hide'); if (mode === 'hlobby') pollLobby(); };
}

/* ---- 레이스 ---- */
async function startRace() {
  const btn = $('begin');
  if (btn) { btn.disabled = true; btn.textContent = '시작하는 중…'; }
  clearTimeout(lobbyTimer);
  let players;
  try { players = await hostRpc('marble_host_start_race', { p_room: room.room_id }); }
  catch (e) {
    if (btn) { btn.disabled = false; btn.textContent = '시작하기'; }
    alert(errMsg(e, '시작하지 못했습니다.'));
    if (mode === 'hlobby') pollLobby();
    return;
  }
  room.status = 'racing';
  showHost('race');
  ranksSent = false; submitting = null; running = false; raceEnded = false; raceT = 0;
  buildCourse(); setupMarbles(players);
  camY = 0; lastT = 0; renderPodium(); resize();
  bar.innerHTML = `<span class="badge">${players.length}명 · 입장 마감</span>
                   <button class="big" id="go">출발!</button>`;
  $('go').onclick = e => { running = true; e.target.disabled = true; };
}

const bigEl = $('bigtxt');
function announce(m) {
  renderPodium();
  bigEl.textContent = `${m.rank}등  ${m.name}`;
  bigEl.style.color = ['#fbbf24','#cbd5e1','#d97757'][m.rank - 1] || '#fff';
  bigEl.classList.add('on');
  clearTimeout(bigTimer); bigTimer = setTimeout(() => bigEl.classList.remove('on'), 2200);
  if (finished.length >= winnersNeeded()) finishRace();
}
let bigTimer = null;
let raceEnded = false;
function finishRace() {
  if (raceEnded) return;
  raceEnded = true; running = false;
  submitting = submitRanks(); setTimeout(showHostResult, 1700);
}
// 1·2·3등이 골인한 그 순간, 나머지는 얼마나 멀리 갔는지로 줄을 세웁니다
function finalRanking() {
  return [...finished, ...marbles.filter(m => !m.done).sort((a, b) => b.y - a.y)];
}
async function submitRanks() {
  if (ranksSent) return true;
  const ids = finalRanking().map(m => m.id).filter(Boolean);
  if (!ids.length) return false;
  try {
    await hostRpc('marble_host_submit_ranks', { p_room: room.room_id, p_ids: ids });
    ranksSent = true; room.status = 'result';
    return true;
  } catch (e) { console.warn('결과 전송 실패', e); return false; }
}

/* ---- 결과 ---- */
async function showHostResult() {
  showHost('hresult');
  $('hresult').innerHTML = `<h1>축하합니다 🎉</h1><p class="hsub">결과 불러오는 중…</p>`;
  bar.innerHTML = '';
  if (submitting) await submitting;
  if (!ranksSent && room.status !== 'result') {
    $('hresult').innerHTML = `<h1>결과 전송 실패</h1><p class="err">네트워크를 확인하고 다시 보내주세요. 골인 순서는 그대로 남아 있습니다.</p>`;
    bar.innerHTML = `<button class="big" id="retry">결과 다시 보내기</button>`;
    $('retry').onclick = () => { submitting = submitRanks(); showHostResult(); };
    return;
  }
  let rows = [];
  try { rows = await hostRpc('marble_host_results', { p_room: room.room_id }); }
  catch (e) { $('hresult').innerHTML = `<h1>결과</h1><p class="err">${esc(errMsg(e, '순위를 불러오지 못했습니다.'))}</p>`; }
  const top = rows.slice(0, 3);
  const L = ['1등','2등','3등'], C = ['g','s','b'];
  const order = [1, 0, 2].filter(i => top[i]);   // 시상대: 2등 · 1등 · 3등
  $('hresult').innerHTML = `
    <div class="hbadges">
      <span class="badge">방장 : ${esc(room.title || hostName)}</span>
      ${room.is_prize ? '<span class="badge prize"><img class="brand" src="starbucks.svg" alt="" onerror="this.replaceWith(&#39;☕&#39;)"> 상품이 있어요</span>' : '<span class="badge practice">즐겜모드</span>'}
    </div>
    <h1>축하합니다 🎉</h1>
    <div class="fpod">${order.map(i => `
      <div class="fcard ${C[i]}"><div class="fm">${MEDAL[i]}</div><div class="fr">${L[i]}</div>
        <div class="fn">${esc(top[i].nick)}</div></div>`).join('')}</div>
    <p class="hsub">${room.is_prize
      ? '1,2,3등은 <b>스타벅스 커피 상품권</b>을 드려요.<br>모바일 폰에서 <b>쿠폰 확인하기</b> 클릭'
      : '축하합니다!'}</p>
    <div class="hboard">${rows.map(x =>
      `<div class="brow ${x.rank <= 3 ? 'top' : ''}"><span class="r">${x.rank}</span><span class="nm">${esc(x.nick)}</span></div>`).join('')}</div>`;
  bar.innerHTML = `<button class="ghost sm" id="myReward">🎁 방장 결과 보기</button>
                   <button class="danger" id="reset">초기화 (참가자 비우기)</button>
                   <button class="ghost sm" id="hleave">나가기</button>`;
  $('reset').onclick = doReset;
  $('hleave').onclick = closeRoom;
  $('myReward').onclick = showHostReward;
}

// 방장 본인의 결과 — 참가자 폰과 같은 규칙 (kind 만 보고 분기)
async function showHostReward() {
  const pid = localStorage.getItem(HOST_PID_KEY);
  if (!pid) { toast('방장 참가 기록이 없습니다'); return; }
  let rw;
  try { rw = await rpc('marble_my_reward', { p_id: pid }); }
  catch (e) { alert(errMsg(e, '결과를 불러오지 못했습니다.')); return; }
  $('modal').innerHTML = `<div class="mbox">
    ${rw.kind === 'prize' ? `
      <h2>${MEDAL[rw.rank - 1] || ''} ${rw.rank}등 · ${esc(rw.label || '상품')}</h2>
      <div class="barcode"><img src="${rw.image}" alt="쿠폰 바코드"></div>
      <p class="note">📸 이 화면을 캡처해두세요</p>` : `
      <h2>${rw.rank}등</h2>
      <p class="ctext">${esc(rw.text || '')}</p>
      ${rw.url ? `<a class="goodeal-btn" href="${esc(rw.url)}" target="_blank" rel="noopener">플링크 7% 할인 받기</a>` : ''}`}
    <button class="ghost" id="mclose">닫기</button>
  </div>`;
  $('modal').classList.remove('hide');
  $('mclose').onclick = () => $('modal').classList.add('hide');
}

async function doReset() {
  if (!confirm('이 방의 참가자와 결과를 모두 지우고 대기실로 돌아갑니다. 쿠폰·멘트는 유지됩니다. 진행할까요?')) return;
  try {
    await hostRpc('marble_host_reset', { p_room: room.room_id });
    const j = await rpc('marble_join_game', { p_code: room.code, p_nick: room.title || hostName });   // 방장 다시 입장
    localStorage.setItem(HOST_PID_KEY, j.player_id);
    await openHostRoom(room.room_id);
  }
  catch (e) { alert(errMsg(e, '초기화 실패')); }
}

/* ---- 루프 ---- */
function frame(t) {
  if (!lastT) lastT = t;
  let dt = (t - lastT) / 1000; lastT = t;
  if (dt > 0.05) dt = 0.05;
  if (mode === 'race') {
    if (running) { step(dt); raceT += dt; if (raceT > CONFIG.MAX_RACE_SEC) finishRace(); }
    draw(); renderLive();
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
window.addEventListener('resize', () => { if (mode === 'race') resize(); });

/* ============================================================
   시작 — 호스트 방 > 참가자 세션 > 입구
   ============================================================ */
const savedHostRoom = localStorage.getItem(HOST_ROOM_KEY);
if (savedHostRoom && !urlCode) openHostRoom(savedHostRoom);
else if (myId) poll();
else if (urlCode && sessions()[urlCode]) resumeSession(urlCode).then(ok => { if (!ok) screenEntry(); });
else screenEntry();
document.addEventListener('visibilitychange', () => { if (!document.hidden && myId) poll(); });
</script>
</body>
